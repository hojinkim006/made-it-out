name: Bug
description: Something is broken
labels: ["bug"]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      placeholder: "1. Go to ...\n2. Click ...\n3. See ..."
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
