name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Web (lint, typecheck, test, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - uses: actions/upload-artifact@v4
        if: github.ref == 'refs/heads/main'
        with:
          name: web-dist
          path: web/dist

  pipeline:
    name: Pipeline (ruff, pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pipeline
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pipeline/pyproject.toml
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest -q

  guard:
    name: No large files or secrets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reject files over 5 MB (datasets belong in data/raw, which is git-ignored)
        run: |
          big=$(git ls-files -z | xargs -0 -I{} find {} -size +5M)
          if [ -n "$big" ]; then echo "Large files committed:"; echo "$big"; exit 1; fi
      - name: Reject committed .env files
        run: |
          if git ls-files | grep -E '(^|/)\.env$'; then echo ".env must not be committed"; exit 1; fi
