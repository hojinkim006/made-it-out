# Netlify build settings. This file overrides what's typed in the Netlify UI.
# Docs: https://docs.netlify.com/configure-builds/file-based-configuration/
#
# Also set these in Netlify -> Site configuration -> Environment variables
# (they are baked in at build time, so redeploy after changing them):
#   VITE_SUPABASE_URL
#   VITE_SUPABASE_PUBLISHABLE_KEY

[build]
  base = "web"              # the app lives in web/
  command = "npm run build"
  publish = "dist"          # relative to base, i.e. web/dist

[build.environment]
  NODE_VERSION = "22"
